      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease -PSERVER_URL="${{ github.event.inputs.server_url }}"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk signage-player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: signage-player-apk
          path: signage-player.apk
